name: Build Capacitor APK from Zip

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Locate project (zip 또는 폴더)
        id: loc
        run: |
          set -e
          if [ -f package.json ] && [ -d scripts ] && [ -d web ]; then
            DIR="$(pwd)"
          else
            ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" -not -path "./node_modules/*" | head -n 1)
            if [ -z "$ZIP_FILE" ]; then echo "zip 파일을 찾지 못했습니다"; exit 1; fi
            echo "zip: $ZIP_FILE"
            rm -rf unzipped_project && mkdir -p unzipped_project
            unzip -q -o "$ZIP_FILE" -d unzipped_project
            PKG=$(find unzipped_project -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -n 1)
            if [ -z "$PKG" ]; then echo "package.json을 찾지 못했습니다"; exit 1; fi
            DIR="$(cd "$(dirname "$PKG")" && pwd)"
          fi
          echo "프로젝트 폴더: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: 의존성 설치
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npm install

      - name: www 생성 + 안드로이드 프로젝트 준비
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          npm run setup
          echo "--- www/index.html 앞부분 ---"
          head -c 300 www/index.html
          ls -la www www/lib

      - name: APK 빌드 (debug)
        working-directory: ${{ steps.loc.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: book-reader-apk
          path: ${{ steps.loc.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
